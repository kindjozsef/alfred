info:
  name: 02 - Stateles
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/chat/completions"
  body:
    type: json
    data: |-
      {
        "model": "{{model}}",
        "messages": [
          {
            "role": "user",
            "content": "Do you remember me? Who am I?"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
